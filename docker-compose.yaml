name: roboshop 
services:
 mongodb:
  build: ./mongodb   #we say go to mongodb file inside current directory
  image: srikanth865/mongodb:v1 #its like build image taking my hub name with image name docker build -t srikanth865/mongodb:v1
  container_name: mongodb #its like run container docker run -d srikanth865/mongodb:v1
  volumes:
  - mongodb:/data/db
 catalogue:
  build: ./catalogue
  image: srikanth865/catalogue:v1
  container_name: catalogue
  depends_on:
  - mongodb # mongodb depends on catalogue by loading data so we put in depends
 frontend:
   build: ./frontend
   image: srikanth865/frontend:v1
   container_name: frontend
   ports:
   - "80:80"   #its like -p 80:80 
   depends_on:
   - catalogue
 redis:
   image: redis:7  #we are taking offical image in docker HUb direct without build 
   container_name: redis # docker run -d --name redis --network roboshop redis:7
   volumes:
   - redis:/data
 user:
   build: ./user
   image: srikanth865/user:v1
   container_name: user
   environment: #we give in here only for increasing spped in build time we give speed reduced
    MONGO: true
    REDIS_URL: 'redis://redis:6379'
    MONGO_URL: "mongodb://mongodb:27017/users"
   depends_on:
   - redis
   - mongodb
 cart:
   build: ./cart
   image: srikanth865/cart:v1
   container_name: cart
   environment:
    REDIS_HOST: redis
    CATALOGUE_HOST: catalogue
    CATALOGUE_PORT: 8080
   depends_on:
   - redis
   - catalogue
 mysql:
   build: ./mysql
   image: srikanth865/mysql:v1
   container_name: mysql
   command: --innodb-lock_wait_timeout=120
   environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"
   volumes:
   - mysql:/var/lib/mysql

 shipping:
   build: ./shipping
   image: srikanth865/shipping:v1
   container_name: shipping
   environment:
    CART_ENDPOINT: cart:8080
    DB_HOST: mysql
   depends_on:
    - mysql
    - cart
 rabbitmq:
   image: rabbitmq:3
   container_name: rabbitmq
   environment:
     RABBITMQ_DEFAULT_USER: roboshop
     RABBITMQ_DEFAULT_PASS: roboshop123
   volumes:
   - rabbitmq:/var/lib/rabbitmq #rabbitmq stores data in the path  /var/lib/rabbitmq as official rabbitmq hub
 payment:
   build: ./payment
   image: srikanth865/payment:v1
   container_name: payment
   environment:
    CART_HOST: cart
    CART_PORT: 8080
    USER_HOST: user
    USER_PORT: 8080
    AMQP_HOST: rabbitmq
    AMQP_USER: roboshop
    AMQP_PASS: roboshop123
   depends_on:
    - cart
    - user
    - rabbitmq
networks:
  default: # this means all the services in this file use this network roboshop
    name: roboshop
    driver: bridge
    external: false # if true it should be created manually, if false docker creates this network as we are creating
volumes: #we are adding volumes to our databases stateful applications only 
 mongodb: # docker volume create mongodb
 redis: # docker volume create redis
 mysql:
 rabbitmq: 

    




   

     